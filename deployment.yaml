apiVersion: apps/v1
kind: Deployment # Job, Pod, ConfigMap, etc...
metadata:
  name: blog
  labels:
    app: blog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog
  template:
    metadata:
      labels:
        app: blog
    spec:
      containers:
        - name: blog
          image: lachlanmillerdev/blog:latest
          ports:
            - containerPort: 7777
